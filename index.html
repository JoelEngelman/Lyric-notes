<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f7"><title>Lyric Notes</title>
<style>
:root{--bg:#f5f5f7;--panel:#fff;--text:#17171a;--muted:#77777f;--line:#dedee3;--accent:#111113;--accentText:#fff;--shadow:0 12px 40px #0000000b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{height:100vh;display:flex;overflow:hidden}.sidebar{width:275px;background:#ededf0;border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px}.brand{font-size:21px;font-weight:750;padding:7px 5px}.new{border:0;background:var(--accent);color:var(--accentText);padding:12px 15px;border-radius:12px;font-weight:650}.search{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;outline:0;width:100%}.notes{overflow:auto;display:flex;flex-direction:column;gap:5px}.note{border:0;background:transparent;text-align:left;padding:12px;border-radius:12px;color:var(--text);display:flex}.note:hover,.note.active{background:#fff}.note strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note small{color:var(--muted);display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:70px;border-bottom:1px solid var(--line);background:#ffffffc9;backdrop-filter:blur(18px);display:flex;align-items:center;padding:12px 22px;gap:15px}.title{border:0;background:transparent;font-size:21px;font-weight:700;outline:0;min-width:0;flex:1}.actions,.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,.tool,.select,.num{border:1px solid var(--line);background:var(--panel);padding:9px 12px;border-radius:10px;color:var(--text)}.btn.dark{background:var(--accent);color:white;border-color:var(--accent)}.btn.danger{color:#c93434}.editor-wrap{flex:1;overflow:auto}.editor{max-width:1250px;margin:35px auto;padding:0 30px 80px}.meta{color:var(--muted);font-size:13px;margin-bottom:18px}.song-view{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.big-line{position:relative;border-bottom:1px solid var(--line)}.big-line:last-child{border-bottom:0}.lane{position:relative;min-height:86px;border-bottom:1px solid var(--line);padding:12px 18px}.lane:last-child{border-bottom:0}.lane-name{position:absolute;left:8px;top:8px;font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;z-index:4}.line-grid{margin-left:62px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));min-height:61px;position:relative}.line-grid:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to right,transparent 0,transparent calc(12.5% - 1px),var(--line) 12.5%);pointer-events:none;opacity:.7}.lyric-cell{min-width:0;text-align:center;padding:23px 5px 8px;font-size:18px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative;z-index:2}.lyric-cell:hover{background:#f0f0f2;border-radius:8px}.blank-cell{position:relative;min-height:61px}.blank-cell:after{content:"";position:absolute;left:8px;right:8px;top:50%;border-top:1px solid var(--line)}.melody-grid{position:relative;min-height:61px}.melody-cell{position:relative;min-height:61px}.melody-note{position:absolute;left:50%;top:30px;width:18px;height:13px;background:var(--text);border-radius:50%;transform:translateX(-50%);z-index:3}.melody-note:after{content:"";position:absolute;width:2px;height:28px;background:var(--text);right:0;bottom:7px}.melody-note small{position:absolute;top:-20px;left:-12px;color:var(--muted);font-size:9px;white-space:nowrap}.melody-note.grid-note{width:14px;height:10px}.melody-note.selected-note{outline:3px solid #999}.line-number{position:absolute;right:9px;top:8px;color:var(--muted);font-size:9px}.editor-tools{display:flex;gap:8px;align-items:center;margin:18px 0 10px}.lyrics{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:14px;outline:0;background:var(--panel);font-size:18px;line-height:1.65;color:var(--text);font-family:inherit;padding:15px}.status{position:fixed;bottom:17px;right:22px;color:var(--muted);font-size:12px;background:#ffffffdd;padding:6px 9px;border-radius:9px}.mobile-menu{display:none}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column}.overlay.open{display:flex}.mtop{min-height:68px;border-bottom:1px solid var(--line);padding:10px 16px;background:#ffffffd9;backdrop-filter:blur(18px);display:flex;align-items:center;gap:10px}.mname{font-size:18px;font-weight:750;flex:1}.workspace{flex:1;overflow:auto;padding:18px}.sheet-card,.lyric-card,.grid-card,.keyboard-card{max-width:1250px;margin:0 auto 14px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.sheet-card{padding:18px;overflow:auto}.staff{height:235px;min-width:850px;position:relative}.stafflines{position:absolute;left:20px;right:20px;top:55px;height:90px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 17px,#a9a9af 18px,#a9a9af 19px)}.clef{position:absolute;left:30px;top:57px;font-family:serif;font-size:78px;line-height:1}.mbar{position:absolute;top:55px;height:90px;border-left:1px solid #777}.music-note{position:absolute;width:18px;height:13px;background:#17171a;border-radius:50%;transform:translateX(-9px);z-index:2}.music-note:after{content:"";position:absolute;width:2px;height:38px;background:#17171a;right:0;bottom:8px}.note-label{position:absolute;top:-25px;left:-12px;font-size:11px;color:#555;white-space:nowrap}.chord-label{position:absolute;top:18px;font-weight:700;font-size:13px;transform:translateX(-50%);white-space:nowrap}.lyric-card{padding:16px;overflow:auto}.lyric-row{display:flex;gap:7px;align-items:flex-end;min-width:max-content;padding:15px 10px 10px}.word{border:0;background:#f0f0f2;border-radius:8px;padding:8px 9px;color:#222}.word.selected{background:#111;color:#fff}.word small{display:block;color:#888;font-size:9px;margin-top:4px}.word.selected small{color:#ccc}.grid-card{padding:14px;overflow:auto}.grid-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.grid-title{font-weight:750;font-size:15px}.grid-help{color:var(--muted);font-size:12px;flex:1}.grid-scroll{overflow:auto}.step-grid{display:grid;grid-template-columns:110px repeat(32,28px);min-width:1010px;gap:2px;align-items:center}.grid-label{height:27px;display:flex;align-items:center;padding-left:7px;font-size:11px;font-weight:650;white-space:nowrap}.step{height:27px;border:1px solid var(--line);background:#f7f7f8;border-radius:5px;padding:0}.step:hover{background:#e7e7ea}.step.on{background:#17171a;border-color:#17171a}.step.beat{border-left:2px solid #aaa}.step.playhead{box-shadow:inset 0 0 0 2px #888}.keyboard-card{padding:14px;overflow:auto}.keyboard{display:flex;height:150px;min-width:700px;justify-content:center}.key{position:relative;width:52px;height:140px;border:1px solid #aaa;background:#fff;border-radius:0 0 7px 7px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;font-size:11px}.key.black{width:32px;height:88px;background:#18181a;color:white;margin:0 -16px;z-index:2;border-color:#111;border-radius:0 0 5px 5px}.selected-note{outline:3px solid #aaa}.inspector{position:fixed;right:20px;bottom:20px;width:275px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:0 15px 50px #0002;display:none;z-index:20}.inspector.show{display:block}.inspector h3{margin:0 0 10px}.field{display:flex;justify-content:space-between;align-items:center;margin:9px 0;gap:8px}.field input,.field select{width:135px;border:1px solid var(--line);border-radius:8px;padding:7px}.modal{position:fixed;inset:0;background:#0006;z-index:50;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal-card{width:min(470px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 25px 80px #0004}.modal-card h2{margin:0 0 7px}.modal-card p{color:var(--muted);font-size:13px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.modal-grid{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center}.modal-grid label{font-size:13px}.modal-grid input,.modal-grid select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:var(--panel);color:var(--text)}
.darkmode{--bg:#111113;--panel:#1b1b1e;--text:#f4f4f5;--muted:#a1a1a8;--line:#36363b;--accent:#f4f4f5;--accentText:#111}.darkmode .sidebar{background:#18181b}.darkmode .top,.darkmode .mtop{background:#161619dd}.darkmode .search,.darkmode .btn,.darkmode .tool,.darkmode .select,.darkmode .num,.darkmode .song-view,.darkmode .sheet-card,.darkmode .lyric-card,.darkmode .grid-card,.darkmode .keyboard-card,.darkmode .inspector,.darkmode .modal-card,.darkmode .lyrics{background:#1b1b1e;color:var(--text)}.darkmode .lyric-cell:hover{background:#29292d}.darkmode .blank-cell:after{border-color:#36363b}.darkmode .music-note,.darkmode .music-note:after,.darkmode .melody-note,.darkmode .melody-note:after{background:#eee}.darkmode .key{background:#ddd;color:#111}.darkmode .key.black{background:#050505;color:#fff}.darkmode .step{background:#242428}.darkmode .step:hover{background:#303035}.darkmode .step.on{background:#eee;border-color:#eee}
@media(max-width:760px){.sidebar{display:none}.mobile-menu{display:block}.editor{margin:25px auto;padding:0 12px 70px}.actions .optional{display:none}.inspector{left:15px;right:15px;bottom:15px;width:auto}.top{padding:10px 13px}.modal-grid{grid-template-columns:1fr}.line-grid{margin-left:45px}.lane{padding-left:10px;padding-right:10px}.lane-name{left:4px;font-size:8px}.lyric-cell{font-size:14px}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar"><div class="brand">♪ Lyric Notes</div><button class="new" onclick="newSong()">＋ New Song</button><input class="search" id="search" placeholder="Search songs…" oninput="renderSongs()"><div class="notes" id="songList"></div><button class="btn" onclick="toggleTheme()">☾ Appearance</button></aside>
<main class="main"><header class="top"><button class="btn mobile-menu" onclick="document.querySelector('.sidebar').style.display='flex'">☰</button><input class="title" id="title" placeholder="Untitled Song" oninput="saveCurrent()"><div class="actions"><button class="btn optional" onclick="exportTxt()">Export TXT</button><button class="btn" onclick="exportProject()">Export Project</button><button class="btn dark" onclick="openMelody()">♪ Melody Model</button></div></header><div class="editor-wrap"><div class="editor"><div class="meta" id="meta"></div><div class="song-view"><div id="songScore"></div></div><div class="editor-tools"><strong>Edit lyrics</strong><span style="color:var(--muted);font-size:12px">The words above automatically flow into the song lines.</span></div><textarea class="lyrics" id="lyrics" placeholder="Start writing your lyrics…" oninput="saveCurrent()"></textarea></div></div><div class="status" id="status">Saved</div></main></div>
<div class="overlay" id="melody"><div class="mtop"><button class="btn" onclick="closeMelody()">← Back</button><div class="mname" id="mname">Melody Model</div><div class="tools"><button class="tool" id="playBtn" onclick="togglePlayback()">▶ Play</button><button class="tool" onclick="stopPlayback()">■ Stop</button><button class="tool" id="metroBtn" onclick="toggleMetronome()">♩ Metronome</button><label class="tool">BPM <input class="num" id="bpm" type="number" min="40" max="240" value="100" style="width:70px" onchange="saveMelody()"></label><select class="select" id="instrument" onchange="saveMelody()"><option>Piano</option><option>Guitar</option><option>Bass</option><option>Organ</option><option>Strings</option><option>Synth</option><option>Pluck</option><option>Drums</option></select><select class="select" id="duration" onchange="setDuration(this.value)"><option value=".25">1/16</option><option value=".5">1/8</option><option value="1" selected>1/4</option><option value="2">1/2</option><option value="4">1</option><option value="8">2</option></select><select class="select" id="timeSig" onchange="saveMelody()"><option>4/4</option><option>3/4</option><option>6/8</option><option>2/4</option></select></div></div><div class="workspace"><div class="sheet-card"><div class="staff" id="staff"></div></div><div class="lyric-card"><div class="lyric-row" id="lyricRow"></div></div><div class="grid-card"><div class="grid-head"><div class="grid-title" id="gridTitle">Instrument Grid</div><div class="grid-help" id="gridHelp">Click cells to build a pattern. Each column is a 1/16 step.</div><button class="tool" id="savePatternBtn" onclick="openSavePattern()" style="display:none">Save to Project</button><button class="tool" onclick="clearGrid()">Clear</button></div><div class="grid-scroll"><div class="step-grid" id="stepGrid"></div></div></div><div class="keyboard-card"><div class="keyboard" id="keyboard"></div></div></div><div class="inspector" id="inspector"></div></div>
<div class="modal" id="savePatternModal"><div class="modal-card"><h2>Save piano rhythm to project</h2><p>Choose where this piano rhythm should be inserted into the song's melody.</p><div class="modal-grid"><label for="insertMode">Insert position</label><select id="insertMode" onchange="updateInsertBeat()"><option value="end">After existing melody</option><option value="start">At the beginning</option><option value="selected">At selected note</option><option value="custom">Custom beat</option></select><label id="insertBeatLabel" for="insertBeat">Start beat</label><input id="insertBeat" type="number" min="0" step=".25" value="0"></div><div class="modal-actions"><button class="btn" onclick="closeSavePattern()">Cancel</button><button class="btn dark" onclick="savePianoPatternToProject()">Insert Rhythm</button></div></div></div>
<script>
const KEY="lyricNotesSongsV2",GRID_STEPS=32,DRUM_ROWS=["Kick","Snare","Closed Hat","Open Hat","Clap","Low Tom","Mid Tom","High Tom","Crash","Ride"],MELODY_ROWS=[72,71,70,69,68,67,66,65,64,63,62,61,60],LINE_BEATS=8;
let songs=JSON.parse(localStorage.getItem(KEY)||"null")||[{id:crypto.randomUUID(),title:"Untitled Song",lyrics:"",melody:{events:[],bpm:100,instrument:"Piano",timeSig:"4/4"}}],current,selectedWord=-1,selectedEvent=-1,selectedDuration=1,audioContext=null,playing=false,playTimer=null,metroTimer=null,metronome=false,noiseBuffer=null;
current=songs[0].id;
function currentSong(){return songs.find(s=>s.id===current)}function saveAll(){localStorage.setItem(KEY,JSON.stringify(songs))}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function words(){let t=currentSong().lyrics||"";return t.trim()?t.trim().split(/\s+/):[]}
function saveCurrent(){let s=currentSong();s.title=document.getElementById('title').value||'Untitled Song';s.lyrics=document.getElementById('lyrics').value;saveAll();renderSongs();updateMeta();renderSongScore();flashSaved()}
function flashSaved(){let x=document.getElementById('status');x.textContent='Saved';clearTimeout(window.st);window.st=setTimeout(()=>x.textContent='',1200)}
function updateMeta(){let t=document.getElementById('lyrics').value.trim();document.getElementById('meta').textContent=`${t?t.split(/\s+/).length:0} words · ${t.length} characters`}
function loadCurrent(){let s=currentSong();document.getElementById('title').value=s.title;document.getElementById('lyrics').value=s.lyrics;updateMeta();renderSongs();renderSongScore()}
function renderSongs(){let q=(document.getElementById('search')?.value||'').toLowerCase(),box=document.getElementById('songList');if(!box)return;box.innerHTML='';songs.filter(s=>(s.title+' '+s.lyrics).toLowerCase().includes(q)).forEach(s=>{let b=document.createElement('button');b.className='note '+(s.id===current?'active':'');b.onclick=()=>{current=s.id;selectedWord=-1;selectedEvent=-1;loadCurrent()};b.innerHTML=`<span><strong>${esc(s.title||'Untitled')}</strong><small>${esc((s.lyrics||'').replace(/\s+/g,' ').slice(0,45)||'No lyrics yet')}</small></span>`;box.appendChild(b)})}
function newSong(){let s={id:crypto.randomUUID(),title:'Untitled Song',lyrics:'',melody:{events:[],bpm:100,instrument:'Piano',timeSig:'4/4'}};songs.unshift(s);current=s.id;saveAll();loadCurrent();document.getElementById('title').focus()}
function toggleTheme(){document.body.classList.toggle('darkmode');localStorage.setItem('lnDark',document.body.classList.contains('darkmode'))}if(localStorage.getItem('lnDark')==='true')document.body.classList.add('darkmode');
function ensureMelody(){let s=currentSong();s.melody=s.melody||{events:[],bpm:100,instrument:'Piano',timeSig:'4/4'};s.melody.events=s.melody.events||[];return s.melody}
function renderSongScore(){let s=currentSong(),w=words(),box=document.getElementById('songScore');if(!box)return;box.innerHTML='';let total=Math.max(1,Math.ceil(Math.max(w.length,s.melody?.events?.reduce((a,e)=>Math.max(a,e.start+e.duration),0)||0)/LINE_BEATS));for(let line=0;line<total;line++){let big=document.createElement('div');big.className='big-line';big.innerHTML=`<div class="line-number">${line+1}</div><div class="lane"><div class="lane-name">Lyrics</div><div class="line-grid lyric-grid"></div></div><div class="lane"><div class="lane-name">Future</div><div class="line-grid blank-grid"></div></div><div class="lane"><div class="lane-name">Melody</div><div class="line-grid melody-grid"></div></div>`;box.appendChild(big);let lyricGrid=big.querySelector('.lyric-grid'),blank=big.querySelector('.blank-grid'),melGrid=big.querySelector('.melody-grid');for(let c=0;c<8;c++){let idx=line*8+c;let lc=document.createElement('div');lc.className='lyric-cell';if(w[idx]){lc.textContent=w[idx];lc.title=w[idx];}lyricGrid.appendChild(lc);blank.appendChild(document.createElement('div'));let mc=document.createElement('div');mc.className='melody-cell';melGrid.appendChild(mc)};let evs=(s.melody?.events||[]).map((e,i)=>({...e,_i:i})).filter(e=>e.start>=line*LINE_BEATS&&e.start<=(line+1)*LINE_BEATS);evs.forEach(e=>{let cell=melGrid.children[Math.min(7,Math.floor((e.start-line*LINE_BEATS)))];if(!cell)return;let n=document.createElement('div');n.className='melody-note '+(e.grid?'grid-note ':'')+(e._i===selectedEvent?'selected-note':'');n.title=`${noteName(e.pitch)} · beat ${e.start}`;n.innerHTML=`<small>${noteName(e.pitch)}</small>`;n.onclick=()=>{selectedEvent=e._i;selectedWord=e.word??-1;openMelody();showInspector()};cell.appendChild(n)})}}
function openMelody(){let m=ensureMelody();document.getElementById('melody').classList.add('open');document.getElementById('mname').textContent=currentSong().title;document.getElementById('bpm').value=m.bpm;document.getElementById('instrument').value=m.instrument||'Piano';document.getElementById('timeSig').value=m.timeSig||'4/4';renderMelody();renderGrid();renderKeyboard()}
function closeMelody(){stopPlayback();document.getElementById('melody').classList.remove('open');saveMelody()}
function saveMelody(){let m=ensureMelody();m.bpm=Math.max(40,Math.min(240,Number(document.getElementById('bpm').value)||100));m.instrument=document.getElementById('instrument').value;m.timeSig=document.getElementById('timeSig').value;saveAll();renderMelody();renderGrid();renderSongScore()}
function noteName(m){let n=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];return n[((m%12)+12)%12]+(Math.floor(m/12)-1)}function pitchY(m){return 145-(m-60)*4}
function renderMelody(){let s=currentSong(),w=words(),staff=document.getElementById('staff'),row=document.getElementById('lyricRow');staff.innerHTML='<div class="stafflines"></div><div class="clef">𝄞</div>';row.innerHTML='';w.forEach((x,i)=>{let b=document.createElement('button');let ev=s.melody.events.find(e=>e.word===i&&!e.grid);b.className='word '+(i===selectedWord?'selected':'');b.innerHTML=esc(x)+`<small>${ev?noteName(ev.pitch):'—'}</small>`;b.onclick=()=>{selectedWord=i;selectedEvent=-1;renderMelody();showInspector()};row.appendChild(b)});let maxBeat=Math.max(16,s.melody.events.reduce((a,e)=>Math.max(a,e.start+e.duration),0)+4);staff.style.width=Math.max(850,maxBeat*62+100)+'px';for(let i=0;i<=maxBeat;i+=4){let bar=document.createElement('div');bar.className='mbar';bar.style.left=(75+i*62)+'px';staff.appendChild(bar)}s.melody.events.forEach((e,i)=>{let x=75+e.start*62,n=document.createElement('div');n.className='music-note '+(i===selectedEvent?'selected-note':'');n.style.left=x+'px';n.style.top=pitchY(e.pitch)+'px';n.onclick=()=>{selectedEvent=i;selectedWord=e.word??-1;renderMelody();showInspector()};n.innerHTML=e.rest?'<span class="rest-mark">𝄽</span>':`<span class="note-label">${noteName(e.pitch)}</span>`;staff.appendChild(n);if(e.chord){let c=document.createElement('div');c.className='chord-label';c.style.left=x+'px';c.textContent=e.chord;staff.appendChild(c)}})}
function showInspector(){let box=document.getElementById('inspector'),s=currentSong();if(selectedEvent<0){if(selectedWord<0){box.classList.remove('show');return}box.className='inspector show';box.innerHTML=`<h3>${esc(words()[selectedWord])}</h3><p style="color:var(--muted);font-size:13px">Choose a piano key to assign a note.</p><button class="btn" onclick="addRest()">Add Rest</button>`;return}let e=s.melody.events[selectedEvent];box.className='inspector show';box.innerHTML=`<h3>${e.grid?'Piano rhythm':'Note'} ${noteName(e.pitch)}</h3><div class="field">Timing <input type="number" step=".25" min="0" value="${e.start}" onchange="editEvent('start',this.value)"></div><div class="field">Duration <select onchange="editEvent('duration',this.value)">${[.25,.5,1,2,4,8].map(x=>`<option value="${x}" ${e.duration==x?'selected':''}>${x} beat${x==1?'':'s'}</option>`).join('')}</select></div><div class="field">Chord <input value="${esc(e.chord||'')}" placeholder="e.g. Cmaj7" onchange="editEvent('chord',this.value)"></div><button class="btn danger" onclick="deleteEvent()">Delete note</button>`}
function editEvent(k,v){let e=currentSong().melody.events[selectedEvent];e[k]=k==='chord'?v:Number(v);saveMelody();showInspector()}function deleteEvent(){currentSong().melody.events.splice(selectedEvent,1);selectedEvent=-1;saveMelody();renderMelody();showInspector()}
function ensureGridData(){let m=ensureMelody();if(!m.grid)m.grid={instrument:m.instrument,steps:[]};if(!Array.isArray(m.grid.steps))m.grid.steps=[];return m.grid}function gridIsDrum(){return document.getElementById('instrument').value==='Drums'}
function renderGrid(){let g=ensureGridData(),box=document.getElementById('stepGrid'),inst=document.getElementById('instrument').value,drum=inst==='Drums';g.instrument=inst;document.getElementById('gridTitle').textContent=drum?'Drum Pattern':`${inst} Pattern`;document.getElementById('gridHelp').textContent=drum?'Click cells to build a drum beat. Each column is a 1/16 step.':'Click cells to build a rhythm. Each column is a 1/16 step.';document.getElementById('savePatternBtn').style.display=inst==='Piano'&&g.steps.length?'inline-block':'none';box.innerHTML='';let rows=drum?DRUM_ROWS:MELODY_ROWS;rows.forEach((r,ri)=>{let lab=document.createElement('div');lab.className='grid-label';lab.textContent=drum?r:noteName(r);box.appendChild(lab);for(let step=0;step<GRID_STEPS;step++){let b=document.createElement('button');b.className='step '+(step%4===0?'beat':'');let key=drum?`${ri}:${step}`:`${r}:${step}`;if(g.steps.includes(key))b.classList.add('on');b.dataset.step=step;b.onclick=()=>toggleGridCell(key);box.appendChild(b)}});saveAll()}
function toggleGridCell(key){let g=ensureGridData(),i=g.steps.indexOf(key);if(i>=0)g.steps.splice(i,1);else g.steps.push(key);saveAll();renderGrid();let [a]=key.split(':').map(Number);if(gridIsDrum())playDrum(DRUM_ROWS[a]);else playTone(a,.16)}function clearGrid(){ensureGridData().steps=[];saveAll();renderGrid()}
function openSavePattern(){if(!ensureGridData().steps.length)return;document.getElementById('insertMode').value='end';updateInsertBeat();document.getElementById('savePatternModal').classList.add('open')}function closeSavePattern(){document.getElementById('savePatternModal').classList.remove('open')}
function updateInsertBeat(){let mode=document.getElementById('insertMode').value,ev=currentSong().melody.events,beat=0;if(mode==='end')beat=ev.reduce((a,e)=>Math.max(a,e.start+e.duration),0);if(mode==='selected'&&selectedEvent>=0)beat=ev[selectedEvent].start;if(mode==='custom')beat=Number(document.getElementById('insertBeat').value)||0;document.getElementById('insertBeat').value=beat;document.getElementById('insertBeat').disabled=mode!=='custom';document.getElementById('insertBeatLabel').textContent=mode==='custom'?'Start beat':'Insertion beat'}
function savePianoPatternToProject(){let g=ensureGridData(),ev=currentSong().melody.events,mode=document.getElementById('insertMode').value,start=0;if(mode==='end')start=ev.reduce((a,e)=>Math.max(a,e.start+e.duration),0);else if(mode==='selected'&&selectedEvent>=0)start=ev[selectedEvent].start;else if(mode==='custom')start=Math.max(0,Number(document.getElementById('insertBeat').value)||0);g.steps.forEach(key=>{let [pitch,step]=key.split(':').map(Number);ev.push({word:-1,pitch,start:start+step*.25,duration:.25,grid:true,chord:''})});ev.sort((a,b)=>a.start-b.start);saveAll();closeSavePattern();renderMelody();renderSongScore();flashSaved()}
function ensureAudio(){if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume()}function getNoiseBuffer(){ensureAudio();if(noiseBuffer)return noiseBuffer;let len=Math.floor(audioContext.sampleRate*2),b=audioContext.createBuffer(1,len,audioContext.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;noiseBuffer=b;return b}
function noiseHit(t,d,v,type,f,q=1){let s=audioContext.createBufferSource(),fl=audioContext.createBiquadFilter(),g=audioContext.createGain();s.buffer=getNoiseBuffer();fl.type=type;fl.frequency.setValueAtTime(f,t);fl.Q.value=q;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(audioContext.destination);s.start(t);s.stop(t+d+.03)}function oscHit(type,t,f1,f2,d,v){let o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+Math.min(.12,d));g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(audioContext.destination);o.start(t);o.stop(t+d+.03)}
function playDrum(name,dur=.12,when=0){ensureAudio();let t=audioContext.currentTime+when;switch(name){case'Kick':oscHit('sine',t,150,43,Math.max(.2,dur+.1),.8);oscHit('triangle',t,70,38,.09,.16);break;case'Snare':noiseHit(t,.16,.31,'highpass',1500,1);oscHit('triangle',t,185,105,.12,.16);break;case'Closed Hat':noiseHit(t,.045,.18,'highpass',7200,.7);break;case'Open Hat':noiseHit(t,.28,.16,'highpass',6200,.65);break;case'Clap':noiseHit(t,.035,.25,'bandpass',1800,.8);noiseHit(t+.018,.055,.2,'bandpass',1500,.9);noiseHit(t+.045,.09,.14,'bandpass',1300,1);break;case'Low Tom':oscHit('sine',t,155,75,.28,.42);break;case'Mid Tom':oscHit('sine',t,205,105,.24,.36);break;case'High Tom':oscHit('sine',t,275,145,.2,.32);break;case'Crash':noiseHit(t,.8,.22,'highpass',4300,.55);noiseHit(t+.02,.5,.11,'bandpass',7600,.5);break;case'Ride':noiseHit(t,.38,.13,'highpass',5200,.7);oscHit('sine',t,420,380,.25,.06)}}
function playTone(midi,dur=.5,when=0){ensureAudio();let inst=document.getElementById('instrument').value,o=audioContext.createOscillator(),g=audioContext.createGain(),now=audioContext.currentTime+when,types={Piano:'triangle',Guitar:'triangle',Bass:'sine',Organ:'sine',Strings:'sawtooth',Synth:'square',Pluck:'triangle'};o.type=types[inst]||'triangle';o.frequency.value=440*Math.pow(2,(midi-69)/12);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(inst==='Piano'?.24:.2,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g).connect(audioContext.destination);o.start(now);o.stop(now+dur+.03)}
function playGridPattern(){let g=ensureGridData(),sec=60/currentSong().melody.bpm/4;g.steps.forEach(k=>{let[a,b]=k.split(':').map(Number);if(gridIsDrum())playDrum(DRUM_ROWS[a],.12,b*sec);else playTone(a,Math.min(.22,sec*.85),b*sec)})}function highlightGridStep(step){document.querySelectorAll('#stepGrid .step').forEach(x=>x.classList.toggle('playhead',Number(x.dataset.step)===step))}
function renderKeyboard(){let box=document.getElementById('keyboard');box.innerHTML='';for(let o=0;o<2;o++)for(let i=0;i<12;i++){let p=48+o*12+i,k=document.createElement('button');k.className='key '+([1,3,6,8,10].includes(i)?'black':'');k.textContent=noteName(p);k.onclick=()=>addNote(p);box.appendChild(k)}}
function addNote(pitch){if(selectedWord<0){selectedWord=words().length?0:-1;if(selectedWord<0)return}let s=currentSong(),existing=s.melody.events.findIndex(e=>e.word===selectedWord&&!e.grid),start=existing>=0?s.melody.events[existing].start:(s.melody.events.length?s.melody.events[s.melody.events.length-1].start+s.melody.events[s.melody.events.length-1].duration:0),e={word:selectedWord,pitch,start,duration:selectedDuration,chord:''};if(existing>=0)s.melody.events[existing]=e;else s.melody.events.push(e);selectedEvent=s.melody.events.indexOf(e);playTone(pitch,.35);saveMelody();renderMelody();showInspector()}
function addRest(){let s=currentSong(),start=s.melody.events.length?s.melody.events.at(-1).start+s.melody.events.at(-1).duration:0;s.melody.events.push({word:selectedWord,pitch:60,start,duration:selectedDuration,rest:true,chord:''});saveMelody();renderMelody();renderSongScore()}function setDuration(v){selectedDuration=Number(v);if(selectedEvent>=0){currentSong().melody.events[selectedEvent].duration=selectedDuration;saveMelody();showInspector()}}
function togglePlayback(){if(playing)pausePlayback();else startPlayback()}function startPlayback(){let s=currentSong();ensureAudio();playing=true;document.getElementById('playBtn').textContent='Ⅱ Pause';let sec=60/s.melody.bpm,events=[...s.melody.events].sort((a,b)=>a.start-b.start);events.forEach(e=>{if(!e.rest)playTone(e.pitch,e.duration*sec,e.start*sec)});playGridPattern();let total=Math.max(1,...events.map(e=>e.start+e.duration),GRID_STEPS/4),start=performance.now();function tick(){if(!playing)return;let beat=(performance.now()-start)/1000/sec,idx=events.findIndex(e=>beat>=e.start&&beat<e.start+e.duration);if(idx>=0){selectedWord=events[idx].word??-1;selectedEvent=s.melody.events.indexOf(events[idx]);renderMelody();renderSongScore()}highlightGridStep(Math.floor(beat*4)%GRID_STEPS);if(beat>=total){stopPlayback();return}playTimer=requestAnimationFrame(tick)}tick();if(metronome)startMetronome()}function pausePlayback(){playing=false;cancelAnimationFrame(playTimer);stopMetronomeTimer();document.getElementById('playBtn').textContent='▶ Play';highlightGridStep(-1)}function stopPlayback(){playing=false;cancelAnimationFrame(playTimer);stopMetronomeTimer();document.getElementById('playBtn').textContent='▶ Play';highlightGridStep(-1)}function toggleMetronome(){metronome=!metronome;document.getElementById('metroBtn').classList.toggle('active',metronome);if(metronome&&playing)startMetronome();else if(!metronome)stopMetronomeTimer()}function startMetronome(){stopMetronomeTimer();let sec=60/currentSong().melody.bpm;function click(){if(!metronome||!playing)return;playTone(84,.055);metroTimer=setTimeout(click,sec*1000)}click()}function stopMetronomeTimer(){clearTimeout(metroTimer);metroTimer=null}
function exportTxt(){let s=currentSong();download(`${s.title}\n\n${s.lyrics}`,(s.title||'lyrics')+'.txt','text/plain')}function exportProject(){let s=currentSong();download(JSON.stringify(s,null,2),(s.title||'song')+'.lyricnotes.json','application/json')}function download(data,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'){e.preventDefault();newSong()}if(document.getElementById('melody').classList.contains('open')){let map={a:60,w:61,s:62,e:63,d:64,f:65,t:66,g:67,y:68,h:69,u:70,j:71};if(map[e.key.toLowerCase()]!==undefined&&!e.target.matches('input,select,textarea'))addNote(map[e.key.toLowerCase()]);if(e.code==='Space'&&!e.target.matches('input,textarea')){e.preventDefault();togglePlayback()}}});
loadCurrent();renderSongs();
</script></body></html>
